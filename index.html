<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keygraph.js</title>
<style>
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #4f46e5;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar-group { display: flex; align-items: center; gap: 8px; }
  .toolbar-group + .toolbar-group { margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--border); }
  .toolbar input[type="number"] {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 64px;
  }
  button {
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  button:hover { background: #f1f5f9; }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:disabled:hover { background: #fff; }
  .export-wrap { position: relative; }
  .export-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    display: flex;
    flex-direction: column;
    min-width: 175px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.15);
    z-index: 20;
  }
  .export-menu[hidden] { display: none; }
  .export-menu button {
    text-align: left;
    border: none;
    background: none;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .export-menu button:hover { background: #f1f5f9; }
  /* Add-node submenu drops down left-aligned under its button. */
  .addnode-menu { right: auto; left: 0; }
  /* Example-graph submenu drops down left-aligned under its button. */
  .example-menu { right: auto; left: 0; min-width: 200px; }
  .export-menu .menu-section {
    padding: 8px 10px 3px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  #contextMenu {
    position: fixed;
    z-index: 50;
    min-width: 170px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
  }
  #contextMenu[hidden] { display: none; }
  #contextMenu button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 13px;
  }
  #contextMenu button:hover { background: #f1f5f9; }
  #contextMenu button.danger { color: var(--danger); }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #network { flex: 1 1 auto; border-right: 1px solid var(--border); background: #fff; }
  #resizer {
    flex: 0 0 6px;
    width: 6px;
    cursor: col-resize;
    touch-action: none;
    background: transparent;
  }
  #resizer:hover, body.resizing #resizer { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  #sidebar {
    width: 350px;
    flex: 0 0 350px;
    min-width: 260px;
    overflow-y: auto;
    padding: 12px;
    background: var(--panel);
  }
  #sidebar h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  #sidebar h2:first-child { margin-top: 0; }
  #sidebar .graph-name-input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .stats { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0; min-height: 16px; }
  .hint.error { color: var(--danger); }
  .node-row { margin-bottom: 6px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px; }
  .node-row.selected { background: #eef2ff; outline: 1px solid var(--accent); }
  .node-row .node-main-line { display: flex; align-items: center; gap: 6px; }
  .node-row .node-id { font-size: 11px; color: var(--muted); width: 26px; flex: 0 0 26px; font-variant-numeric: tabular-nums; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
  .node-row .node-name { flex: 1 1 auto; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-row .node-chip { flex: 0 0 auto; font-size: 11px; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .node-row .node-edit { flex: 0 0 auto; padding: 2px 6px; font-size: 12px; }
  .node-row .edge-del { flex: 0 0 auto; padding: 2px 6px; font-size: 12px; color: var(--danger); border-color: var(--border); background: #fff; }
  .node-row .edge-del:hover { background: #fef2f2; }
  .node-row .node-weight-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .node-row .node-wlabel { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
  .node-row input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .node-row .node-val { flex: 0 0 36px; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .node-row .node-edit-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .node-row .node-edit-line[hidden] { display: none; }
  .node-row .node-edit-line input[type="text"] { flex: 1 1 auto; min-width: 0; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; }
  .node-row .node-edit-line input.group-input { flex: 0 0 72px; min-width: 72px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; }
  .edge-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; padding: 2px 4px; border-radius: 4px; }
  .edge-row.selected { background: #eef2ff; outline: 1px solid var(--accent); }
  .edge-row .edge-label { flex: 0 0 92px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edge-row input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .edge-row .edge-val { flex: 0 0 36px; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .edge-row .edge-del { padding: 2px 6px; font-size: 12px; color: var(--danger); border-color: var(--border); background: #fff; }
  .edge-row .edge-del:hover { background: #fef2f2; }
  .edge-row input[type="checkbox"] { flex: 0 0 14px; margin: 0; }
  .bulk-bar { display: flex; align-items: center; gap: 6px; margin: 8px 0 4px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: #f8fafc; }
  .bulk-bar[hidden] { display: none; }
  .bulk-bar .bulk-count { flex: 0 0 auto; font-size: 12px; color: var(--muted); }
  .bulk-bar input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .bulk-bar button { padding: 2px 6px; font-size: 12px; }
  .select-all-row { padding: 2px 4px; }
  .select-all-row .edge-label { color: var(--muted); }
  .empty { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Keygraph.js</h1>
  <div class="toolbar">
    <div class="toolbar-group">
      <button id="btnLoad" title="JSON, GML, graphML">Load file…</button>
      <button id="btnSave" title="Save in JSON format.">Save file…</button>
      <div class="export-wrap" id="exportWrap">
        <button id="btnExport" title="Export the graph in a standard graph format" aria-haspopup="true" aria-expanded="false">Export…</button>
        <div class="export-menu" id="exportMenu" hidden>
          <button type="button" data-format="gml">GML (.gml)</button>
          <button type="button" data-format="graphml">GraphML (.graphml)</button>
          <button type="button" data-format="dot">DOT (.dot)</button>
        </div>
      </div>
    </div>
    <div class="toolbar-group">
      <button id="btnNew" title="Create a complete graph with the given node count">New complete graph</button>
      <input type="number" id="nodeCount" min="1" max="64" value="8" title="Node count for a new complete graph" aria-label="Node count for a new complete graph" />
      <div class="export-wrap" id="exampleWrap">
        <button id="btnExamples" title="Load a well-known example graph" aria-haspopup="true" aria-expanded="false">Example graphs…</button>
        <div class="export-menu example-menu" id="exampleMenu" hidden>
          <div class="menu-section">Named</div>
          <button type="button" data-example="hubs">Two Hubs</button>
          <button type="button" data-example="petersen">Petersen graph</button>
          <button type="button" data-example="k33">K3,3 (utility)</button>
          <button type="button" data-example="kite">Krackhardt kite</button>
          <button type="button" data-example="cube">Hypercube Q3</button>
          <div class="menu-section">Structural</div>
          <button type="button" data-example="star">Star (S8)</button>
          <button type="button" data-example="cycle">Cycle (C8)</button>
          <button type="button" data-example="tree">Binary tree</button>
          <button type="button" data-example="grid">Grid (4×4)</button>
          <button type="button" data-example="dag">DAG (directed)</button>
        </div>
      </div>
      <div class="export-wrap" id="addNodeWrap">
        <button id="btnAddNode" title="Add a node (isolated or fully connected)" aria-haspopup="true" aria-expanded="false">Add node</button>
        <div class="export-menu addnode-menu" id="addNodeMenu" hidden>
          <button type="button" data-mode="isolated">Isolated</button>
          <button type="button" data-mode="connected">Fully connected</button>
        </div>
      </div>
      <button id="btnConnect" title="Click two nodes to add an edge between them">Connect nodes</button>
      <button id="btnMode" title="Switch between undirected and directed mode (destructive; a confirmation is asked first)">Mode: undirected</button>
    </div>
    <div class="toolbar-group">
      <button id="btnAutoLayout" title="Run the force layout once, then freeze it">Auto-layout</button>
      <button id="btnUndoLayout" title="Restore the positions from before the last auto-layout" disabled>Undo layout</button>
      <button id="btnEdgeLabels" title="Show the weight next to each edge in the graph view">Edge labels: off</button>
      <button id="btnNodeLabels" title="Show the weight next to each node in the graph view">Vertex weights: off</button>
    </div>
  </div>
</header>
<main>
  <div id="network" role="img" aria-label="Graph canvas"></div>
  <div id="resizer" title="Drag to resize the sidebar"></div>
  <div id="sidebar">
    <h2>Graph</h2>
    <input type="text" id="graphName" class="graph-name-input" placeholder="Graph name (saved in JSON)" aria-label="Graph name" />
    <div class="stats" id="stats"></div>
    <div class="hint" id="message" role="status" aria-live="polite">Click two nodes with "Connect nodes" to add an edge. Click an edge to jump to it in the list. Drag nodes to arrange.</div>
    <h2>Nodes — name &amp; group</h2>
    <div id="nodeList"></div>
    <h2>Edges — weight (0–1)</h2>
    <div class="bulk-bar" id="bulkBar" hidden>
      <span class="bulk-count" id="bulkCount">0 selected</span>
      <input type="range" id="bulkSlider" min="0" max="1" step="0.01" title="Set all selected edges to this weight">
      <span class="edge-val" id="bulkVal">0.50</span>
      <button id="btnBulkClear" title="Clear selection">Clear</button>
    </div>
    <div class="edge-row select-all-row">
      <input type="checkbox" id="selectAllEdges" title="Select all edges" aria-label="Select all edges">
      <span class="edge-label">Select all</span>
    </div>
    <div id="edgeList"></div>
  </div>
</main>
<input type="file" id="fileInput" accept=".json,.graphml,.gml,application/json,application/xml,application/x-gml" hidden />
<datalist id="groupOptions"></datalist>
<div id="contextMenu" hidden></div>
<script src="vendor/vis-network.min.js"></script>
<script src="src/app.js"></script>
</body>
</html>
